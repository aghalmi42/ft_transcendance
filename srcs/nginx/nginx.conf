worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Avatar uploads are capped at 2MB server-side (see users.controller.ts) —
    # leave headroom so nginx doesn't reject the request before it gets there.
    client_max_body_size 5m;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Everything (REST + the /socket.io/ websocket handshake used by every
        # gateway namespace) is proxied straight to the backend — this listener
        # exists purely to terminate TLS in front of it, per the subject's
        # "any connection to the backend must use HTTPS" requirement.
        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support (socket.io).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Socket.io connections are long-lived — the default 60s read
            # timeout would silently kill idle game/chat sockets.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
