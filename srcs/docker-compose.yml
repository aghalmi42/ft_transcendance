services:

  postgres:
    image: postgres:16-bookworm
    container_name: transcendence_postgres
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend
    container_name: transcendence_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: transcendence_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend


volumes:

  postgres_data:
  backend_node_modules:
  frontend_node_modules: